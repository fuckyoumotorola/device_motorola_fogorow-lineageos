name: Build LineageOS for fogorow

on:
  workflow_dispatch:
    inputs:
      clean_sync:
        description: "Delete old source before syncing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sync_jobs:
        description: "Repo sync jobs. Lower is safer against Google rate limits"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "6"
          - "8"

permissions:
  contents: write

jobs:
  build:
    name: Build fogorow
    runs-on: self-hosted
    timeout-minutes: 1440

    env:
      DEVICE: fogorow
      DEVICE_PATH: device/motorola/fogorow
      DEVICE_REPO: https://github.com/fuckyoumotorola/device_motorola_fogorow-lineageos
      VENDOR_REPO: https://github.com/fuckyoumotorola/vendor_motorola_fogorow
      MANIFEST_BRANCH: lineage-22.2
      WORKDIR: /mnt/lineage/fogorow
      CCACHE_DIR: /mnt/lineage/ccache
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache

    steps:
      - name: Prepare build environment
        shell: bash
        run: |
          set -e

          if command -v xbps-install >/dev/null 2>&1; then
            xbps-install -Syu || true

            install_if_missing() {
              pkg="$1"

              if xbps-query -p pkgver "$pkg" >/dev/null 2>&1; then
                echo "$pkg already installed"
                return 0
              fi

              echo "Installing $pkg..."
              xbps-install -Sy "$pkg" || echo "Skipping unavailable package: $pkg"
            }

            PACKAGES="
              bash
              bc
              bison
              ccache
              curl
              flex
              gcc
              gcc-multilib
              git
              git-lfs
              gnupg
              gperf
              ImageMagick
              lz4
              lzop
              make
              ncurses-devel
              ncurses-libs-32bit
              openssl-devel
              perl
              pngcrush
              python3
              readline-devel
              rsync
              schedtool
              squashfs-tools
              unzip
              which
              libxml2
              libxml2-devel
              libxslt
              libxslt-devel
              zip
              zlib-devel
              zlib-32bit
            "

            for pkg in $PACKAGES; do
              install_if_missing "$pkg"
            done
          fi

          git lfs install --skip-repo || true

          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            echo "Downloading repo tool..."
            curl -L --progress-bar https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
            chmod a+x "$HOME/bin/repo"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

          mkdir -p "$WORKDIR" "$CCACHE_DIR"

      - name: Configure ccache
        shell: bash
        run: |
          set -e
          export PATH="$HOME/bin:$PATH"

          ccache -M 100G || true
          ccache -o compression=true || true

      - name: Clean source if requested
        if: ${{ inputs.clean_sync == 'true' }}
        shell: bash
        run: |
          set -e
          rm -rf "$WORKDIR"

      - name: Init LineageOS source
        shell: bash
        run: |
          set -e
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b "$MANIFEST_BRANCH" \
            --git-lfs
      - name: Sync source with visible progress
        shell: bash
        run: |
          set -e
          export PATH="$HOME/bin:$PATH"

          cd "$WORKDIR"

          SYNC_JOBS="${{ inputs.sync_jobs }}"

          sync_once() {
            EXTRA_ARGS=""

            if repo sync -h 2>&1 | grep -q -- "--retry-fetches"; then
              EXTRA_ARGS="$EXTRA_ARGS --retry-fetches=10"
            fi

            if repo sync -h 2>&1 | grep -q -- "--jobs-network"; then
              EXTRA_ARGS="$EXTRA_ARGS --jobs-network=2"
            fi

            echo "::group::Repo sync command"
            echo "Sync jobs: $SYNC_JOBS"
            echo "Extra args: $EXTRA_ARGS"
            echo "::endgroup::"

            repo sync \
              -c \
              --force-sync \
              --optimized-fetch \
              --no-tags \
              --no-clone-bundle \
              --force-broken \
              --fail-fast \
              --verbose \
              $EXTRA_ARGS \
              -j"$SYNC_JOBS"
          }

          keep_alive() {
            while true; do
              echo "[$(date '+%H:%M:%S')] Still syncing LineageOS sources..."
              echo "Current source size:"
              du -sh "$WORKDIR" 2>/dev/null || true

              echo "Git projects already present:"
              find "$WORKDIR" -type d -name ".git" 2>/dev/null | wc -l || true

              sleep 60
            done
          }

          for attempt in 1 2 3 4 5; do
            echo "::group::repo sync attempt $attempt/5"
            echo "Starting repo sync attempt $attempt/5 at $(date)"

            keep_alive &
            KEEP_ALIVE_PID="$!"

            if sync_once; then
              kill "$KEEP_ALIVE_PID" 2>/dev/null || true
              wait "$KEEP_ALIVE_PID" 2>/dev/null || true

              echo "repo sync finished successfully at $(date)"
              echo "::endgroup::"
              exit 0
            fi

            kill "$KEEP_ALIVE_PID" 2>/dev/null || true
            wait "$KEEP_ALIVE_PID" 2>/dev/null || true

            echo "repo sync attempt $attempt failed at $(date)"
            echo "::endgroup::"

            wait_seconds=$((attempt * 900))
            echo "Waiting ${wait_seconds}s before retry..."
            sleep "$wait_seconds"
          done

          echo "repo sync failed after all retries"
          exit 1

      - name: Clone device and vendor trees
        shell: bash
        run: |
          set -e

          cd "$WORKDIR"

          rm -rf "$DEVICE_PATH"
          git clone --depth=1 -b lineage-22.2 "$DEVICE_REPO" "$DEVICE_PATH" || \
          git clone --depth=1 "$DEVICE_REPO" "$DEVICE_PATH"

          rm -rf vendor/motorola/fogorow
          git clone --depth=1 "$VENDOR_REPO" vendor/motorola/fogorow || true

      - name: Show device tree info
        shell: bash
        run: |
          set -e

          cd "$WORKDIR"

          echo "Device tree files:"
          ls -la "$DEVICE_PATH"

          echo "AndroidProducts.mk:"
          cat "$DEVICE_PATH/AndroidProducts.mk" || true

          echo "Available fogorow mk files:"
          find "$DEVICE_PATH" -maxdepth 1 -name "*.mk" -print

      - name: Build ROM
        shell: bash
        run: |
          set -e
          export PATH="$HOME/bin:$PATH"

          cd "$WORKDIR"

          source build/envsetup.sh

          breakfast lineage_fogorow userdebug || lunch lineage_fogorow-userdebug

          mka bacon -j"$(nproc)"

      - name: Prepare release files
        if: success()
        shell: bash
        run: |
          set -e

          PRODUCT_OUT="$WORKDIR/out/target/product/$DEVICE"
          RELEASE_DIR="$WORKDIR/release-files"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          find "$PRODUCT_OUT" -maxdepth 1 \
            \( -name "*.zip" -o -name "*.img" -o -name "*.txt" \) \
            -type f \
            -exec cp -v {} "$RELEASE_DIR/" \;

          find "$PRODUCT_OUT/obj/PACKAGING/target_files_intermediates" \
            -maxdepth 1 \
            -name "*.zip" \
            -type f \
            -exec cp -v {} "$RELEASE_DIR/" \; || true

          cd "$RELEASE_DIR"
          sha256sum * > SHA256SUMS.txt

          echo "Release files:"
          ls -lh "$RELEASE_DIR"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-fogorow-output
          path: |
            /mnt/lineage/fogorow/out/target/product/fogorow/*.zip
            /mnt/lineage/fogorow/out/target/product/fogorow/*.img
            /mnt/lineage/fogorow/out/target/product/fogorow/*.txt
            /mnt/lineage/fogorow/out/target/product/fogorow/obj/PACKAGING/target_files_intermediates/*.zip
          if-no-files-found: warn

      - name: Upload ROM to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-fogorow-${{ github.run_number }}
          name: LineageOS fogorow build ${{ github.run_number }}
          body: |
            LineageOS build for Motorola fogorow.

            Device: fogorow
            Branch: lineage-22.2
            Build target: bacon
            Workflow run: ${{ github.run_number }}

            SHA256 checksums are attached in SHA256SUMS.txt.
          files: |
            /mnt/lineage/fogorow/release-files/*
